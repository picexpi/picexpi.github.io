name: Build and Deploy Frontend

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies and build
        run: |
          cd frontend
          npm ci || npm install

          cat > .env.production <<EOF
          VITE_API_URL=${{ secrets.VITE_API_URL }}
          VITE_PI_APP_URL=${{ secrets.VITE_PI_APP_URL }}
          VITE_PI_APP_ID=${{ secrets.VITE_PI_APP_ID }}
          VITE_PI_CLIENT_ID=${{ secrets.VITE_PI_CLIENT_ID }}
          VITE_PI_SANDBOX=${{ secrets.VITE_PI_SANDBOX }}
          VITE_DEFAULT_PI_AMOUNT=${{ secrets.VITE_DEFAULT_PI_AMOUNT }}
          VITE_MIN_PI_AMOUNT=${{ secrets.VITE_MIN_PI_AMOUNT }}
          VITE_MAX_PI_AMOUNT=${{ secrets.VITE_MAX_PI_AMOUNT }}
          EOF

          npm run build

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: frontend/dist
          branch: gh-pages
          clean: true
